<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <!-- Gradient for the flow wave -->
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#4a4a8a"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    
    <!-- Gradient for musical notes -->
    <linearGradient id="noteGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded rectangle -->
  <rect x="5" y="5" width="790" height="190" rx="20" ry="20" fill="#0d1117"/>
  
  <!-- Flowing wave pattern (represents mouse movement/motion) -->
  <path d="M 30 130 
           Q 80 80, 130 100 
           T 230 90 
           T 330 110 
           T 430 85 
           T 530 105
           T 630 95
           T 730 100
           T 780 110" 
        stroke="url(#flowGradient)" 
        stroke-width="3" 
        fill="none" 
        opacity="0.6"
        stroke-linecap="round"/>
  
  <path d="M 30 150 
           Q 90 110, 150 130 
           T 270 115 
           T 390 135 
           T 510 110
           T 630 130
           T 750 120" 
        stroke="url(#flowGradient)" 
        stroke-width="2" 
        fill="none" 
        opacity="0.4"
        stroke-linecap="round"/>
  
  <!-- Musical note 1 (eighth note) -->
  <g transform="translate(50, 45)" filter="url(#glow)">
    <ellipse cx="0" cy="35" rx="12" ry="9" fill="url(#noteGradient)" transform="rotate(-20, 0, 35)"/>
    <rect x="9" y="-15" width="4" height="50" fill="url(#noteGradient)"/>
    <path d="M 13 -15 Q 35 -5, 30 20 Q 28 10, 13 5" fill="url(#noteGradient)"/>
  </g>
  
  <!-- Musical note 2 (quarter note) -->
  <g transform="translate(105, 55)" filter="url(#glow)">
    <ellipse cx="0" cy="30" rx="10" ry="7" fill="url(#noteGradient)" transform="rotate(-20, 0, 30)"/>
    <rect x="7" y="-10" width="3.5" height="40" fill="url(#noteGradient)"/>
  </g>
  
  <!-- Text: BeethovenFlow -->
  <text x="145" y="95" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="bold" fill="#ffffff">
    Beethoven<tspan fill="#8b5cf6">Flow</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="148" y="125" font-family="'SF Mono', 'Consolas', monospace" font-size="14" fill="#6b7280" letter-spacing="1">
    Motion-aware music for your workflow
  </text>
  
  <!-- Small decorative staff lines -->
  <g opacity="0.3" stroke="#4a4a8a" stroke-width="1">
    <line x1="620" y1="40" x2="770" y2="40"/>
    <line x1="620" y1="50" x2="770" y2="50"/>
    <line x1="620" y1="60" x2="770" y2="60"/>
    <line x1="620" y1="70" x2="770" y2="70"/>
    <line x1="620" y1="80" x2="770" y2="80"/>
  </g>
  
  <!-- Treble clef (simplified) on staff -->
  <g transform="translate(625, 35)" fill="#8b5cf6" opacity="0.7">
    <path d="M 15 45 
             C 15 35, 25 30, 25 20 
             C 25 10, 15 5, 10 15
             C 5 25, 15 30, 15 25
             C 15 20, 5 15, 5 25
             C 5 40, 20 50, 15 45
             M 13 45 L 13 55
             C 13 60, 8 62, 8 58
             C 8 55, 13 55, 13 55" 
          stroke="#8b5cf6" 
          stroke-width="2.5" 
          fill="none"/>
  </g>
  
  <!-- Small notes on staff -->
  <g fill="#fbbf24" opacity="0.8">
    <ellipse cx="680" cy="55" rx="6" ry="4.5" transform="rotate(-15, 680, 55)"/>
    <ellipse cx="710" cy="70" rx="6" ry="4.5" transform="rotate(-15, 710, 70)"/>
    <ellipse cx="740" cy="50" rx="6" ry="4.5" transform="rotate(-15, 740, 50)"/>
  </g>
  
  <!-- Mouse cursor icon (represents tracking) -->
  <g transform="translate(745, 130)" opacity="0.6">
    <path d="M 0 0 L 0 24 L 6 18 L 12 28 L 16 26 L 10 16 L 18 16 Z" 
          fill="#8b5cf6" 
          stroke="#ffffff" 
          stroke-width="1"/>
  </g>
  
  <!-- Motion dots (representing mouse trail) -->
  <g fill="#8b5cf6">
    <circle cx="720" cy="145" r="2" opacity="0.3"/>
    <circle cx="730" cy="140" r="2.5" opacity="0.4"/>
    <circle cx="738" cy="135" r="3" opacity="0.5"/>
  </g>
</svg>
